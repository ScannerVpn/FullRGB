name: Device report
description: Report a device's compatibility state (works / needs elevation / not controllable)
title: "[device] VENDOR MODEL (VID:PID)"
labels: ["hardware"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! The strongest report includes the **diagnostics zip**
        (Hardware → Export diagnostics, or `FullRGB.exe --export-diagnostics`).
        This list feeds the community [compatibility list](../../blob/main/COMPATIBILITY.md).
  - type: input
    id: device
    attributes:
      label: Device name and model
      placeholder: e.g. CASUE USB KB
    validations:
      required: true
  - type: input
    id: vidpid
    attributes:
      label: VID:PID
      description: Shown on the Hardware page, e.g. 2A7A:939F
    validations:
      required: true
  - type: dropdown
    id: status
    attributes:
      label: Status
      options:
        - "✅ works"
        - "🔓 works elevated (after Unlock more hardware)"
        - "🧩 works with a community protocol"
        - "❌ detected, not controllable"
        - "⬜ not detected at all"
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: FullRGB version
      placeholder: 1.6.0
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Notes
      description: What does the Hardware page say for it? Does the vendor software control its lighting? Any protocol documentation you know of?
