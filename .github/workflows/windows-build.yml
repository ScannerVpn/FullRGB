name: windows-build

# Builds the single-file FullRGB.exe on GitHub's runners.
#
# WHY: publishing from a local machine means uploading ~84 MB over a home
# connection for every release. Building here instead means the artifact is
# produced and attached inside GitHub's network.
#
# The OpenRGB engine tree lives in vendor/ IN THIS REPO, so the csproj's
# PackEngine/AddEngineResource targets work on a clean runner with no extra
# setup: the zip is created from vendor/ and embedded as FullRGB.engine.zip.

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Create/refresh a release with this tag (e.g. v1.0.1). Leave blank to only build an artifact.'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore src/FullRGB/FullRGB.csproj

      - name: Build (Debug) and run headless gates
        shell: pwsh
        run: |
          dotnet build src/FullRGB/FullRGB.csproj -c Debug --nologo
          # --rendertest and --uitest are pure logic/XAML; they need no RGB hardware.
          # --fxtest is NOT run here: it talks to real devices, which a runner has none of.
          $exe = "src/FullRGB/bin/Debug/net8.0-windows/win-x64/FullRGB.exe"
          foreach ($mode in @('--rendertest', '--uitest')) {
            $out = "$env:RUNNER_TEMP\$($mode.Trim('-')).txt"
            $err = "$env:RUNNER_TEMP\$($mode.Trim('-')).err.txt"
            $p = Start-Process -FilePath $exe -ArgumentList $mode `
                   -RedirectStandardOutput $out -RedirectStandardError $err -PassThru -WindowStyle Hidden
            if (-not $p.WaitForExit(180000)) { try { $p.Kill() } catch {}; throw "gate timed out: $mode" }
            # A GUI-subsystem exe inherits the console code page for redirected stdout, which
            # differs per machine (UTF-16LE here UTF-8 there): detect it from NUL density
            # instead of assuming one encoding. A fixed -Encoding breaks one side or the other.
            $bytes = [System.IO.File]::ReadAllBytes($out)
            $nul = ($bytes | Where-Object { $_ -eq 0 }).Count
            if ($bytes.Length -gt 4 -and $nul * 4 -gt $bytes.Length) {
              $text = [System.Text.Encoding]::Unicode.GetString($bytes)
            } else {
              $text = [System.Text.Encoding]::UTF8.GetString($bytes)
            }
            # PRINT FIRST, judge after: the test's own output is the only diagnostic we get
            # when a gate fails, so it must reach the log even (especially) on a red run.
            Write-Host $text
            $errText = [System.IO.File]::ReadAllText($err)
            if ($errText.Trim().Length -gt 0) { Write-Host "STDERR:"; Write-Host $errText }
            if ($p.ExitCode -ne 0) { throw "gate exit code $($p.ExitCode): $mode" }
            $want = if ($mode -eq '--rendertest') { 'ALL RENDER TESTS PASSED' } else { 'ALL UI TESTS PASSED' }
            if ($text -notmatch [regex]::Escape($want)) { throw "gate failed: $mode (missing '$want')" }
            # veto real failures only: a bare 'FAIL' substring also matches test NAMES
            # like "parser: failure flagged", so anchor on the markers the runner prints
            if ($text -match '(?m)^\[FAIL\]' -or $text -match 'TEST\(S\) FAILED') {
              throw "gate failed: $mode (found FAIL)"
            }
          }

      - name: Headless diagnostics gate
        shell: pwsh
        run: |
          # --export-diagnostics exercises the round-21 bug-report zip end to end (support
          # matrix, engine log tail, settings snapshot) with no RGB hardware and no GUI.
          $exe = "src/FullRGB/bin/Debug/net8.0-windows/win-x64/FullRGB.exe"
          $zip = "$env:RUNNER_TEMP\diag.zip"
          $out = "$env:RUNNER_TEMP\diag.txt"
          $p = Start-Process -FilePath $exe -ArgumentList "--export-diagnostics=$zip" `
                 -RedirectStandardOutput $out -PassThru -WindowStyle Hidden
          if (-not $p.WaitForExit(120000)) { try { $p.Kill() } catch {}; throw "diagnostics gate timed out" }
          if ($p.ExitCode -ne 0) { throw "diagnostics gate exit code $($p.ExitCode)" }
          if (-not (Test-Path $zip)) { throw "diagnostics zip was not created" }
          Write-Host "diag zip: $((Get-Item $zip).Length) bytes"
          if ((Get-Item $zip).Length -lt 200) { throw "diagnostics zip suspiciously small" }
          Write-Host ([System.IO.File]::ReadAllText($out))

      - name: Publish single-file exe
        shell: pwsh
        run: |
          $ver = "${{ inputs.tag }}"
          if ($ver.StartsWith('v')) { $ver = $ver.Substring(1) }
          # Only stamp -p:Version for a tagged release build; otherwise the csproj version
          # (1.6.0) must win — a hard-coded fallback would mislabel every push artifact.
          $verArgs = @()
          if (-not [string]::IsNullOrWhiteSpace($ver)) { $verArgs += @("-p:Version=$ver") }
          dotnet publish src/FullRGB/FullRGB.csproj -c Release -r win-x64 -p:PublishDir="${{ github.workspace }}\dist\" @verArgs --nologo

      - name: Verify the engine really is embedded
        shell: pwsh
        run: |
          $exe = "dist/FullRGB.exe"
          $len = (Get-Item $exe).Length
          Write-Host "FullRGB.exe = $([math]::Round($len/1MB,1)) MB"
          # A build with the engine resource MISSING still succeeds but lands ~70 MB.
          # 78 MB is the floor for "engine.zip is in there" (measured: 84 MB).
          if ($len -lt 78MB) { throw "exe is $len bytes - engine.zip is probably missing" }
          (Get-FileHash $exe -Algorithm SHA256).Hash | Tee-Object -FilePath dist/FullRGB.exe.sha256

      - name: Build the installer (Inno Setup)
        shell: pwsh
        run: |
          # Most users download the installer, not the bare exe: it puts the app somewhere the
          # Start Menu, Desktop and "Apps & features" all agree on, and keeps settings.json and
          # the extracted engine OUTSIDE the install dir so an update cannot take them.
          choco install innosetup --no-progress -y | Out-Null
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { throw "ISCC.exe not found after install" }

          # Take the version from the BINARY we just built rather than re-parsing the tag: the
          # installer then always matches the exe it wraps, which removes the "keep the two in
          # step" hazard the .iss warns about. ProductVersion can carry a +build suffix.
          $ver = (Get-Item "dist/FullRGB.exe").VersionInfo.ProductVersion
          if ($ver -match '^([0-9]+\.[0-9]+\.[0-9]+)') { $ver = $Matches[1] }
          Write-Host "installer version: $ver"

          # DistDir is resolved relative to installer\, hence ..\dist and not dist.
          & $iscc "/DAppVersion=$ver" "/DDistDir=..\dist" installer\FullRGB.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed with exit code $LASTEXITCODE" }

          $setup = "installer/Output/FullRGB-Setup-$ver.exe"
          if (-not (Test-Path $setup)) { throw "no installer produced at $setup" }
          $len = (Get-Item $setup).Length
          Write-Host "installer = $([math]::Round($len/1MB,1)) MB"
          # Inno can exit 0 having silently skipped a missing [Files] source, producing a stub.
          # Anything under 20 MB cannot contain the 84 MB payload compressed.
          if ($len -lt 20MB) { throw "installer is only $len bytes - the payload is probably missing" }
          (Get-FileHash $setup -Algorithm SHA256).Hash | Tee-Object -FilePath "$setup.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: FullRGB-Windows-x64
          path: |
            dist/FullRGB.exe
            dist/FullRGB.exe.sha256
            installer/Output/FullRGB-Setup-*.exe
            installer/Output/FullRGB-Setup-*.exe.sha256
          retention-days: 30

      - name: Attach to release
        if: inputs.tag != ''
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ inputs.tag }}"
          # gh writes to stderr and returns non-zero when the release is absent; check the exit
          # code explicitly instead of testing the (empty) stdout, which is always falsy here.
          gh release view $tag 2>$null | Out-Null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --title "FullRGB $tag" `
              --notes "Automated build from commit $env:GITHUB_SHA" --draft
          }
          # Uploading from inside GitHub's network: the assets never cross a home uplink.
          gh release upload $tag dist/FullRGB.exe dist/FullRGB.exe.sha256 --clobber
          gh release upload $tag installer/Output/FullRGB-Setup-*.exe installer/Output/FullRGB-Setup-*.exe.sha256 --clobber
          gh release edit $tag --draft=false
          gh release view $tag --json isDraft,assets
